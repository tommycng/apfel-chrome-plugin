<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #1e2a4a;
      --border: #2a3a5a;
      --text: #e0e0e0;
      --text-muted: #8899aa;
      --accent: #4fc3f7;
      --danger: #ef5350;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .viewer-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    #viewer-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
      color: var(--text);
    }

    #page-indicator {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .zoom-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    #zoom-label {
      font-size: 12px;
      color: var(--text-muted);
      min-width: 46px;
      text-align: center;
    }

    .vbtn {
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .vbtn:hover {
      border-color: var(--accent);
      color: #fff;
    }

    #pages {
      flex: 1;
      overflow: auto;
      padding: 16px 16px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      scrollbar-width: thin;
    }

    .pdf-page {
      position: relative;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      background: #fff;
    }

    .page-canvas {
      display: block;
    }

    .page-placeholder {
      width: 100%;
      background: #fff;
    }

    .textLayer {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      line-height: 1;
      text-align: initial;
      transform-origin: 0 0;
      z-index: 2;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    .textLayer :is(span, br) {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    #viewer-error {
      display: none;
      margin: 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--danger);
      font-size: 13px;
      line-height: 1.5;
    }

    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="viewer-header">
    <span id="viewer-title">Loading PDF…</span>
    <span id="page-indicator"></span>
    <div class="zoom-group">
      <button class="vbtn" id="zoom-out" type="button">−</button>
      <span id="zoom-label">100%</span>
      <button class="vbtn" id="zoom-in" type="button">+</button>
    </div>
    <button class="vbtn" id="download-btn" type="button">Download</button>
  </div>
  <div id="pages"></div>
  <div id="viewer-error"></div>
  <script src="pdf.min.js"></script>
  <script src="pdf-viewer.js"></script>
</body>
</html>
