<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #1e2a4a;
      --border: #2a3a5a;
      --text: #e0e0e0;
      --text-muted: #8899aa;
      --accent: #4fc3f7;
      --accent2: #7c4dff;
      --danger: #ef5350;
      --success: #66bb6a;
      --radius: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Hiragino Mincho ProN", "Yu Mincho", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 12px;
      gap: 10px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
      justify-content: flex-end;
    }

    .icon-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
    }

    .icon-btn:hover, .icon-btn[aria-expanded="true"] {
      color: var(--text);
      border-color: var(--accent);
    }

    #settings-panel {
      display: none;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    #settings-panel.visible {
      display: block;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .settings-grid label {
      color: var(--text-muted);
      font-size: 12px;
    }

    .settings-grid select, .settings-grid input {
      width: 100%;
      min-width: 0;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    .settings-grid select:focus, .settings-grid input:focus {
      border-color: var(--accent);
    }

    #openai-settings, #ollama-settings {
      display: contents;
    }

    #openai-settings.hidden, #ollama-settings.hidden {
      display: none;
    }

    .settings-action {
      grid-column: 2;
      justify-self: end;
      background: var(--surface2);
      color: var(--text);
    }

    .settings-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 9px;
    }

    #settings-status {
      flex: 1;
      color: var(--text-muted);
      font-size: 11px;
    }

    .page-title {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: right;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 3px;
    }

    .tab {
      flex: 1;
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }

    .tab:hover {
      color: var(--text);
      background: var(--surface2);
    }

    .tab.active {
      background: var(--accent2);
      color: #fff;
    }

    #controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .template-row {
      display: flex;
      gap: 6px;
    }

    .template-row select {
      flex: 1;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .template-row select:focus {
      border-color: var(--accent);
    }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }

    .btn-primary:hover {
      filter: brightness(1.1);
    }

    .btn-primary:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-danger:hover {
      filter: brightness(1.1);
    }

    #chat-area {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
    }

    #chat-area.visible {
      display: flex;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px;
      min-height: 0;
    }

    .msg {
      padding: 8px 10px;
      border-radius: var(--radius);
      font-size: 13px;
      line-height: 1.5;
      max-width: 90%;
    }

    .msg.user {
      background: var(--accent2);
      color: #fff;
      align-self: flex-end;
    }

    .msg.assistant {
      background: var(--surface2);
      color: var(--text);
      align-self: flex-start;
    }

    .msg.assistant p {
      margin: 0 0 6px;
    }

    .msg.assistant ul, .msg.assistant ol {
      margin: 2px 0 6px;
      padding-left: 18px;
    }

    .msg.assistant li {
      margin: 1px 0;
    }

    .msg.assistant pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      overflow-x: auto;
      margin: 6px 0;
      font-size: 12px;
    }

    .msg.assistant code {
      background: var(--bg);
      border-radius: 3px;
      padding: 1px 3px;
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    }

    .msg.assistant pre code {
      background: none;
      padding: 0;
    }

    .msg.assistant strong {
      color: #fff;
    }

    .msg.assistant a {
      color: var(--accent);
      text-decoration: none;
    }

    .msg.system {
      background: transparent;
      color: var(--text-muted);
      align-self: center;
      font-size: 12px;
      font-style: italic;
    }

    .chat-input-row {
      display: flex;
      gap: 6px;
    }

    .chat-input-row input {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .chat-input-row input:focus {
      border-color: var(--accent);
    }

    #output-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }

    #result-wrap {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #status {
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
    }

    #status.error {
      color: var(--danger);
    }

    #selection-note {
      display: none;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px;
      max-height: 64px;
      overflow: auto;
      word-break: break-word;
    }

    #selection-note strong {
      color: var(--accent);
    }

    .star-rating {
      position: relative;
      display: inline-block;
      line-height: 1;
      vertical-align: middle;
      letter-spacing: 2px;
      unicode-bidi: bidi-override;
      font-size: 16px;
    }

    .star-rating .star-bg {
      color: #3a3f5a;
    }

    .star-rating .star-fg {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      white-space: nowrap;
      color: #ffb400;
    }

    .robot-rating {
      position: relative;
      display: inline-block;
      line-height: 1;
      vertical-align: middle;
      letter-spacing: 2px;
      unicode-bidi: bidi-override;
      font-size: 16px;
    }

    .robot-rating .robot-bg {
      opacity: 0.15;
    }

    .robot-rating .robot-fg {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .ai-label {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      vertical-align: middle;
    }

    #result {
      flex: 1;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    #result:empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-style: italic;
    }

    #result:empty::after {
      content: "Click \"Process Page\" or switch to Ask tab";
    }

    #result h1, #result h2, #result h3, #result h4, #result h5, #result h6 {
      margin: 12px 0 6px;
      color: var(--accent);
      line-height: 1.3;
    }

    #result h1 { font-size: 17px; }
    #result h2 { font-size: 16px; }
    #result h3 { font-size: 15px; }
    #result h4 { font-size: 14px; }
    #result h5 { font-size: 13px; }
    #result h6 { font-size: 13px; color: var(--text-muted); }

    #result p {
      margin: 0 0 8px;
    }

    #result ul, #result ol {
      margin: 4px 0 8px;
      padding-left: 20px;
    }

    #result li {
      margin: 2px 0;
    }

    #result pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 10px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 12px;
      line-height: 1.4;
    }

    #result code {
      background: var(--bg);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 12px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    }

    #result pre code {
      background: none;
      padding: 0;
      border-radius: 0;
    }

    #result hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    #result a {
      color: var(--accent);
      text-decoration: none;
    }

    #result a:hover {
      text-decoration: underline;
    }

    a.time-link {
      display: inline-block;
      padding: 0 5px;
      margin-right: 2px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface2);
      color: var(--accent) !important;
      text-decoration: none !important;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.4;
      vertical-align: middle;
    }

    a.time-link:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: #000 !important;
    }

    #result strong {
      color: #fff;
    }

    #result em {
      color: var(--accent);
    }

    .copy-btn {
      align-self: flex-end;
      font-size: 12px;
      padding: 4px 10px;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
    }

    #result-wrap .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 1;
      background: var(--bg);
      box-shadow: 0 1px 3px rgba(0,0,0,.35);
    }

    .copy-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    .transcript-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .transcript-toggle {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: none;
    }

    .transcript-toggle:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .transcript-toggle .caret {
      display: inline-block;
      transition: transform .15s;
      margin-right: 5px;
    }

    #transcript {
      max-height: 220px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    #transcript p {
      margin: 0 0 6px;
    }

    #transcript .transcript-error {
      color: var(--danger);
      font-style: italic;
    }

    .token-count {
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <h1>Summarizer</h1>
      <div class="header-actions">
        <span class="page-title" id="page-title">No page loaded</span>
        <button class="icon-btn" id="settings-btn" aria-label="LLM settings" aria-expanded="false" title="LLM settings">⚙</button>
      </div>
    </div>

    <div id="settings-panel">
      <div class="settings-grid">
        <label for="provider-select">Provider</label>
        <select id="provider-select">
          <option value="apfel">Local Apfel</option>
          <option value="openai">OpenAI API</option>
          <option value="ollama">Ollama</option>
        </select>
        <div id="openai-settings">
          <label for="openai-api-key">API key</label>
          <input type="password" id="openai-api-key" placeholder="sk-..." autocomplete="off">
          <label for="openai-model">Model</label>
          <select id="openai-model">
            <option value="gpt-5.6-luna">GPT-5.6 Luna</option>
            <option value="gpt-5">GPT-5</option>
            <option value="gpt-5-mini">GPT-5 mini</option>
            <option value="gpt-5-nano">GPT-5 nano</option>
            <option value="gpt-4.1">GPT-4.1</option>
            <option value="gpt-4.1-mini" selected>GPT-4.1 mini</option>
            <option value="gpt-4.1-nano">GPT-4.1 nano</option>
            <option value="gpt-4o">GPT-4o</option>
            <option value="gpt-4o-mini">GPT-4o mini</option>
            <option value="chatgpt-4o-latest">ChatGPT-4o latest</option>
            <option value="gpt-4-turbo">GPT-4 Turbo</option>
            <option value="o4-mini">o4-mini</option>
            <option value="o3">o3</option>
            <option value="o3-mini">o3-mini</option>
            <option value="o1">o1</option>
            <option value="o1-mini">o1-mini</option>
          </select>
        </div>
        <div id="ollama-settings" class="hidden">
          <label for="ollama-host">Host and port</label>
          <input type="url" id="ollama-host" placeholder="http://host:port" autocomplete="off" spellcheck="false">
          <label for="ollama-model">Model</label>
          <select id="ollama-model" disabled>
            <option value="">Load models from Ollama</option>
          </select>
          <button class="btn settings-action" id="ollama-refresh" type="button">Load models</button>
        </div>
      </div>
      <div class="settings-footer">
        <span id="settings-status">Provider settings are stored locally in this browser profile.</span>
        <button class="btn btn-primary" id="settings-save">Save</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="process">Process</button>
      <button class="tab" data-tab="chat">Ask</button>
    </div>

    <div id="controls">
      <div class="template-row">
        <select id="template-select">
          <option value="summarise">Summarise</option>
          <option value="key_points">Key Points</option>
          <option value="explain_simply">Explain Simply</option>
          <option value="action_items">Action Items</option>
          <option value="sermon_notes">Sermon Notes</option>
          <option value="meeting_notes">Meeting Notes</option>
          <option value="youtube_summary">YouTube Summary</option>
        </select>
        <button class="btn btn-primary" id="process-btn">Process Page</button>
      </div>
      <div class="token-count" id="token-estimate"></div>
    </div>

    <div id="output-area">
      <div id="status"></div>
      <div id="selection-note"></div>
      <div class="transcript-row" id="transcript-row" style="display:none">
        <button class="btn transcript-toggle" id="transcript-toggle" type="button">Show transcript</button>
        <button class="copy-btn" id="transcript-copy" style="display:none">Copy</button>
      </div>
      <div id="transcript" style="display:none"></div>
      <div id="result-wrap">
        <button class="copy-btn" id="copy-btn" style="display:none">Copy</button>
        <div id="result"></div>
      </div>
    </div>

    <div id="chat-area">
      <div id="chat-messages"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Ask about this page..." autocomplete="off">
        <button class="btn btn-primary" id="chat-send">Send</button>
      </div>
    </div>
  </div>

  <script src="sidebar.js"></script>
</body>
</html>
